<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an invoice — InvoiceSnap</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html">Invoice<span>Snap</span></a>
    <nav><a href="index.html">Home</a></nav>
  </div>
</header>

<div class="container">
  <div class="gen-wrap">
    <!-- FORM -->
    <div class="panel">
      <h2>Invoice details</h2>

      <div class="row">
        <div class="field"><label>Your business / name</label><input id="bizName" placeholder="Acme Studio" /></div>
        <div class="field"><label>Invoice #</label><input id="invNumber" placeholder="INV-001" /></div>
      </div>
      <div class="field"><label>Your address / email</label><textarea id="bizInfo" rows="2" placeholder="hello@acme.studio&#10;123 Main St, City"></textarea></div>

      <div class="row">
        <div class="field"><label>Bill to</label><input id="clientName" placeholder="Client Inc." /></div>
        <div class="field"><label>Currency</label>
          <select id="currency">
            <option value="$">USD ($)</option>
            <option value="€">EUR (€)</option>
            <option value="£">GBP (£)</option>
            <option value="₺">TRY (₺)</option>
            <option value="C$">CAD (C$)</option>
            <option value="A$">AUD (A$)</option>
            <option value="₹">INR (₹)</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Client address / email</label><textarea id="clientInfo" rows="2" placeholder="billing@client.com"></textarea></div>

      <div class="row">
        <div class="field"><label>Issue date</label><input id="issueDate" type="date" /></div>
        <div class="field"><label>Due date</label><input id="dueDate" type="date" /></div>
      </div>

      <h3>Line items</h3>
      <table class="items">
        <thead><tr><th style="width:46%">Description</th><th>Qty</th><th>Rate</th><th></th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="btn btn-ghost" id="addItem">+ Add item</button>

      <div class="row" style="margin-top:18px">
        <div class="field"><label>Tax %</label><input id="taxRate" type="number" value="0" min="0" step="0.1" /></div>
        <div class="field"><label>Discount (amount)</label><input id="discount" type="number" value="0" min="0" step="0.01" /></div>
      </div>
      <div class="field"><label>Notes / payment terms</label><textarea id="notes" rows="2" placeholder="Payment due within 14 days. Bank: ..."></textarea></div>
    </div>

    <!-- PREVIEW -->
    <div>
      <div class="toolbar">
        <button class="btn btn-primary" id="downloadPdf">Download PDF</button>
        <button class="btn btn-ghost" id="printBtn">Print</button>
        <button class="btn btn-ghost" id="saveDefaults">Save my details</button>
      </div>
      <div id="preview"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
